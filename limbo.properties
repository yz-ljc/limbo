# Minecraft Java offline-mode Limbo; Java 21+ required.
host=0.0.0.0
port=25566
motd=Atri-DevTeam Limbo Server
server-brand=Atri-DevTeam Limbo Server
max-players=1000
keepalive-seconds=10
timeout-seconds=30
view-distance=2

# none = offline direct connection; velocity = modern; bungee = BungeeCord/Waterfall/Velocity legacy.
proxy-mode=bungee
# Literal proxy IPs or CIDR networks, comma-separated. Required for both proxy modes.
proxy-trusted-addresses=127.0.0.1,::1
# Velocity only: copy the same secret used by the proxy; path relative to this config.
forwarding-secret-file=forwarding.secret

# Empty = built-in cottage. Legacy Alpha .schematic paths are relative to this file.
map-file= ./worlds/limbo.schematic
# Placement offset for an imported schematic (ignored for the built-in cottage).
map-origin-x=0
map-origin-y=0
map-origin-z=0
spawn-x=24.5
spawn-y=30
spawn-z=21.5
spawn-yaw=-90
spawn-pitch=0
